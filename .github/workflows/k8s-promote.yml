# Reusable Kubernetes Deploy Workflow - PR-Based Promotion
#
# Generates promotion information for creating PRs to the GitOps repository.
# This is the SECURE approach - no direct write access to GitOps repo needed.
#
# For automatic dev deployments, use ArgoCD Image Updater instead.
# This workflow is intended for controlled promotions (test, prod).

name: K8s Promote (Info)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (dev, test, prod)'
        type: string
        required: true
      cluster:
        description: 'Target cluster name'
        type: string
        default: tak-k8s-nonprod
      build_id:
        description: 'Build identifier from docker-build workflow'
        type: string
        required: true
      app_name:
        description: 'Application name (defaults to repository name)'
        type: string
        default: ''
      components:
        description: 'Comma-separated components to deploy (empty = all from build index)'
        type: string
        default: ''
      image_namespace:
        description: 'Image namespace (Harbor project) in registry'
        type: string
        default: mwlr-private
      # ----- Harbor (holds the images and the build index) -----
      harbor_host:
        description: 'Harbor hostname (internal only - needs self-hosted runner)'
        type: string
        default: registry.landcareresearch.co.nz
      harbor_username:
        description: 'Harbor robot account name able to read the builds project (e.g. robot$github-builder)'
        type: string
        default: ''
      harbor_builds_project:
        description: 'Harbor project holding build indexes (as pushed by docker-build.yml)'
        type: string
        default: builds
      runs_on:
        description: 'Runner to use. Harbor is internal-only, so this must be a self-hosted runner (e.g. tak-k8s-ci); ubuntu-latest cannot reach it.'
        type: string
        default: 'ubuntu-latest'
    secrets:
      HARBOR_TOKEN:
        required: true
        description: 'Harbor robot account token for fetching the build index'
    outputs:
      promotion_info:
        description: 'JSON with promotion details for creating PR manually or via other automation'
        value: ${{ jobs.prepare-promotion.outputs.promotion_info }}

jobs:
  prepare-promotion:
    runs-on: ${{ inputs.runs_on }}
    environment: ${{ inputs.environment }}
    outputs:
      promotion_info: ${{ steps.output.outputs.promotion_info }}

    steps:
      - name: Set variables
        id: vars
        run: |
          APP_NAME="${{ inputs.app_name }}"
          if [[ -z "$APP_NAME" ]]; then
            APP_NAME="${{ github.event.repository.name }}"
          fi
          
          HARBOR_HOST="${{ inputs.harbor_host }}"
          
          # Images live at ${harbor_host}/${namespace}/${app} (the Harbor project is
          # the namespace; there is no Artifactory `/docker/` path segment).
          # The build index is the OCI artifact docker-build.yml pushes to
          # ${harbor_host}/builds/<image_name>:<build_id> - so app_name must match
          # the image_name the build used (both default to the repository name).
          echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "image_registry=${HARBOR_HOST}/${{ inputs.image_namespace }}/${APP_NAME}" >> $GITHUB_OUTPUT
          echo "build_index_ref=${HARBOR_HOST}/${{ inputs.harbor_builds_project }}/${APP_NAME}:${{ inputs.build_id }}" >> $GITHUB_OUTPUT

      - name: Install oras
        env:
          ORAS_VERSION: 1.2.2
        run: |
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          oras version

      - name: Fetch build metadata
        id: metadata
        env:
          BUILD_INDEX_REF: ${{ steps.vars.outputs.build_index_ref }}
          HARBOR_USERNAME: ${{ inputs.harbor_username }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
        run: |
          set -euo pipefail
          
          # The build index is a tagged OCI artifact in Harbor with two layers,
          # outputs.json (the index) and bake-metadata.json - the same artefact
          # k8s-apps-config's update-app-manifest.sh pulls.
          echo "Fetching build index from: ${BUILD_INDEX_REF}"
          
          rm -rf build-index && mkdir -p build-index
          if ! echo "${HARBOR_TOKEN}" | oras pull -u "${HARBOR_USERNAME}" --password-stdin \
               "${BUILD_INDEX_REF}" -o build-index || [[ ! -s build-index/outputs.json ]]; then
            echo "::error::Failed to fetch the build index ${BUILD_INDEX_REF} from Harbor (check the build pushed it, and that harbor_username / HARBOR_TOKEN can read the ${{ inputs.harbor_builds_project }} project)"
            exit 1
          fi
          cp build-index/outputs.json build-index.json
          
          echo "Build index contents:"
          cat build-index.json

      - name: Generate promotion manifest
        id: output
        run: |
          APP_NAME="${{ steps.vars.outputs.app_name }}"
          ENV="${{ inputs.environment }}"
          CLUSTER="${{ inputs.cluster }}"
          IMAGE_REGISTRY="${{ steps.vars.outputs.image_registry }}"
          BUILD_ID="${{ inputs.build_id }}"
          
          # Determine which components to deploy
          if [[ -n "${{ inputs.components }}" ]]; then
            COMPONENTS="${{ inputs.components }}"
          else
            COMPONENTS=$(jq -r '.outputs[].target' build-index.json | tr '\n' ',' | sed 's/,$//')
          fi
          
          # Build promotion info JSON
          PROMOTION_INFO=$(jq -n \
            --arg app "$APP_NAME" \
            --arg env "$ENV" \
            --arg cluster "$CLUSTER" \
            --arg build_id "$BUILD_ID" \
            --arg registry "$IMAGE_REGISTRY" \
            --arg components "$COMPONENTS" \
            --arg source_repo "${{ github.repository }}" \
            --arg source_sha "${{ github.sha }}" \
            --arg source_run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --slurpfile index build-index.json \
            '{
              app: $app,
              environment: $env,
              cluster: $cluster,
              build_id: $build_id,
              registry: $registry,
              components: ($components | split(",")),
              source: {
                repository: $source_repo,
                sha: $source_sha,
                run_url: $source_run
              },
              images: [
                $index[0].outputs[] | {
                  component: .target,
                  tag: $build_id,
                  digest: .digest,
                  full_ref: "\($registry)/\(.target):\($build_id)@\(.digest)"
                }
              ]
            }')
          
          echo "Promotion info:"
          echo "$PROMOTION_INFO" | jq .
          
          # Output as single line for GitHub Actions
          echo "promotion_info=$(echo "$PROMOTION_INFO" | jq -c .)" >> $GITHUB_OUTPUT

      - name: Upload promotion artifact
        uses: actions/upload-artifact@v4
        with:
          name: promotion-${{ inputs.environment }}-${{ inputs.build_id }}
          path: build-index.json
          retention-days: 90

      - name: Summary
        run: |
          APP_NAME="${{ steps.vars.outputs.app_name }}"
          ENV="${{ inputs.environment }}"
          CLUSTER="${{ inputs.cluster }}"
          BUILD_ID="${{ inputs.build_id }}"
          IMAGE_REGISTRY="${{ steps.vars.outputs.image_registry }}"
          
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 Promotion Ready: ${APP_NAME} → ${ENV}
          
          | Property | Value |
          |----------|-------|
          | Application | \`${APP_NAME}\` |
          | Environment | \`${ENV}\` |
          | Cluster | \`${CLUSTER}\` |
          | Build ID | \`${BUILD_ID}\` |
          
          ### Images to Deploy
          
          | Component | Image Reference |
          |-----------|-----------------|
          EOF
          
          jq -r --arg registry "$IMAGE_REGISTRY" --arg build_id "$BUILD_ID" \
            '.outputs[] | "| \(.target) | `\($registry)/\(.target):\($build_id)@\(.digest)` |"' \
            build-index.json >> $GITHUB_STEP_SUMMARY
          
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          
          ### Next Steps
          
          **For dev environment:** ArgoCD Image Updater handles this automatically.
          
          **For test/prod environments:**
          1. Clone `k8s-apps-config` repository
          2. Update deployment manifests with the image references above
          3. Create a Pull Request for review
          4. After approval and merge, ArgoCD will sync the changes
          
          EOF
